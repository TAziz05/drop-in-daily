# Tells Cloudflare where the Discord bot lives in this repo (the discord-bot folder).
name = "drop-in-daily-bot"
main = "discord-bot/src/index.js"
compatibility_date = "2026-09-01"

# Checks every hour and posts the daily drop in servers whose chosen hour (Eastern) has come.
[triggers]
crons = ["0 * * * *"]

[vars]
SITE_URL = "https://taziz05.github.io/drop-in-daily"

# The database is created automatically on the first deploy.
[[d1_databases]]
binding = "DB"
database_name = "drop-in-daily"

[observability]
enabled = true
